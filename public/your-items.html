<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your Items · Kestrel Gives</title>
    <link rel="icon" href="/favicon-32.png" sizes="32x32">
    <link rel="icon" href="/favicon-16.png" sizes="16x16">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin-var.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/styles/tokens.css">
    <link rel="stylesheet" href="/styles/base.css">
    <link rel="stylesheet" href="/styles/components.css">
    <script type="module" src="/js/main.js"></script>
  </head>
  <body data-page="your-items">
    <a class="skip-link" href="#main">Skip to main content</a>
    <div data-shell-demo></div>
    <div data-shell-header></div>
    <div data-shell-banner></div>
    <main class="page" id="main" tabindex="-1">
      <header class="page-header">
        <div class="page-header__row"><div class="page-header__text">
          <h1 class="page-header__title">Your Items</h1>
          <p class="page-header__description">Your bids, wins and purchases, and the items you donated.</p>
        </div></div>
      </header>
      <p class="loading" role="status" data-page-loading><span class="loading__spinner" aria-hidden="true"></span><span>Loading your items…</span></p>
      <div class="your-items" data-your-items aria-busy="true"></div>
      <section class="empty" aria-labelledby="your-items-error-title" data-your-items-error hidden>
        <span class="empty__icon" data-icon="alert" data-icon-size="lg"></span>
        <h2 class="empty__title" id="your-items-error-title">We couldn't load your items</h2>
        <p class="empty__text">Check your connection and try again.</p>
        <div class="empty__actions"><button type="button" class="btn btn--secondary">Try again</button></div>
      </section>
    </main>
    <footer class="site-footer">
      <p>Kestrel is a fictional organization, and this is a demo. <a href="/design-system/">Design system</a></p>
    </footer>
    <noscript><p class="page">This demo needs JavaScript to load its data.</p></noscript>
  </body>
</html>
