<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Instant Sale · Kestrel Gives</title>
    <link rel="icon" href="/favicon-32.png" sizes="32x32">
    <link rel="icon" href="/favicon-16.png" sizes="16x16">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin-var.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/styles/tokens.css">
    <link rel="stylesheet" href="/styles/base.css">
    <link rel="stylesheet" href="/styles/components.css">
    <script type="module" src="/js/main.js"></script>
  </head>
  <body data-page="instant-sale" data-sale="instant">
    <a class="skip-link" href="#main">Skip to main content</a>
    <div data-shell-demo></div>
    <div data-shell-header></div>
    <div data-shell-banner></div>
    <main class="page" id="main" tabindex="-1">
      <header class="page-header">
        <div class="page-header__row"><div class="page-header__text">
          <h1 class="page-header__title">Instant Sale</h1>
          <p class="page-header__description">Claim items at a set price while they last.</p>
        </div></div>
      </header>
      <div class="browse-toolbar">
        <p class="browse-toolbar__count" data-browse-count></p>
        <div class="field browse-toolbar__sort">
          <label class="field__label" for="sort">Sort by</label>
          <div class="select"><select class="input" id="sort" data-browse-sort></select><span data-icon="chevron-down"></span></div>
        </div>
      </div>
      <p class="visually-hidden" role="status" data-browse-status></p>
      <ul class="item-grid" aria-label="Items" aria-busy="true" data-browse-grid data-browse-type="instant"></ul>
      <section class="empty" aria-labelledby="empty-title" data-browse-empty hidden>
        <span class="empty__icon" data-icon="info" data-icon-size="lg"></span>
        <h2 class="empty__title" id="empty-title" data-empty-title></h2>
        <p class="empty__text" data-empty-text></p>
      </section>
      <section class="empty" aria-labelledby="error-title" data-browse-error hidden>
        <span class="empty__icon" data-icon="alert" data-icon-size="lg"></span>
        <h2 class="empty__title" id="error-title">We couldn't load the items</h2>
        <p class="empty__text">Check your connection and try again.</p>
        <div class="empty__actions"><button type="button" class="btn btn--secondary">Try again</button></div>
      </section>
    </main>
    <footer class="site-footer">
      <p>Kestrel is a fictional organization, and this is a demo. <a href="/design-system/">Design system</a></p>
    </footer>
    <noscript><p class="page">This demo needs JavaScript to load its data.</p></noscript>
  </body>
</html>
